[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify_to_tidal"
version = "1.0.7"
requires-python = ">= 3.10"

dependencies = [
  "spotipy~=2.26",
  "tidalapi~=0.8.10",
  "pyyaml~=6.0",
  "tqdm~=4.64",
  "sqlalchemy~=2.0",
  "typing_extensions>=4.6"
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2~=3.1",
  "itsdangerous~=2.2",
  "python-multipart>=0.0.9"
]
dev = [
  "spotify_to_tidal[web]",
  "pytest~=8.0",
  "pytest-mock~=3.8",
  "httpx2>=2.0",
  "pyright"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["spotify_to_tidal*"]

[tool.setuptools.package-data]
"spotify_to_tidal.web" = ["templates/*.html", "static/*"]

[project.scripts]
spotify_to_tidal = "spotify_to_tidal.__main__:main"
spotify_to_tidal_web = "spotify_to_tidal.web.__main__:main"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
