version: 2.1

jobs:
  setup:
    docker:
      - image: circleci/python:3.10
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"

  test:
    docker:
      - image: circleci/python:3.10
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
      - run:
          name: Run tests
          command: pytest

workflows:
  version: 2
  test_workflow:
    jobs:
      - setup
      - test:
          requires:
            - setup